name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check continuous train motion
        run: node --test tests/history-motion.test.mjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare website paths
        run: node build-pages.mjs
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-build
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
